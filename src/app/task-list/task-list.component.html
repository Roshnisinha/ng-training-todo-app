<ul>
  <li *ngFor="let t of taskService.getTasks(); let i = index" style="margin-bottom: 10px;">
    {{ t }}
    <button 
      (click)="deleteTask(i)" 
      style="margin-left: 10px; padding: 4px 8px; background: red; color: white; border: none; border-radius: 4px;">
      Delete
    </button>
  </li>
</ul>
