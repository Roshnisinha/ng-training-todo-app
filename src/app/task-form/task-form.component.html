<div style="margin-bottom: 20px;">
  <input 
    type="text" 
    placeholder="Enter task"
    [(ngModel)]="taskText"
    style="padding: 8px; width: 250px; margin-right: 8px;"
  />

  <button 
    (click)="addTask()" 
    style="padding: 8px 12px; background: #0070d2; color: white; border: none; border-radius: 4px;">
    Add Task
  </button>
</div>
